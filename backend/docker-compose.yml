services:
  api:
    build: .
    container_name: signalapp-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - signalapp_data:/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: signalapp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - https

volumes:
  signalapp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/signalapp/data

  caddy_data:
  caddy_config:
