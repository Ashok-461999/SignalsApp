name: signalapp_client
description: AlphaPulse AI — professional trading signals with AI analysis
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  fl_chart: ^0.70.2
  intl: ^0.20.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#0A0D12"
  adaptive_icon_foreground: assets/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg_trading_ai.png
